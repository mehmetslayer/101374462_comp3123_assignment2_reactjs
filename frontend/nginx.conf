server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router handles the URL, so unknown paths return index.html instead of a 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # built files have hashed names and can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}